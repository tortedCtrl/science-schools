name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "backend/**"
  push:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: gcc:15.1-bookworm
    env:
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_FORCE_SYSTEM_BINARIES: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and lint tools
        shell: bash
        run: |
          set -euo pipefail
          echo "deb http://deb.debian.org/debian bookworm-backports main" \
            > /etc/apt/sources.list.d/bookworm-backports.list
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake/bookworm-backports \
            curl \
            git \
            ninja-build \
            pkg-config \
            tar \
            unzip \
            zip \
            python3 \
            bison \
            flex \
            lsb-release \
            software-properties-common \
            gnupg

      - name: Install clang-tidy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            https://apt.llvm.org/llvm.sh \
            --output /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 20
          apt-get install -y --no-install-recommends clang-tidy-20 libomp-20-dev
          rm -rf /var/lib/apt/lists/*

      - name: Set up vcpkg
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/build/vcpkg_installed
          key: ${{ runner.os }}-gcc-15-vcpkg-${{ hashFiles('backend/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-gcc-15-vcpkg-

      - name: Configure backend
        run: >-
          cmake -S backend -B backend/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/backend/build/vcpkg_installed

      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: backend/build/vcpkg_installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build backend
        run: cmake --build backend/build --parallel 2

      - name: Run clang-tidy
        shell: bash
        run: |
          set -euo pipefail
          # Clang 20 calls its C++26 draft language mode c++2c.
          find backend/src backend/apps -type f -name '*.cpp' -print0 | \
            xargs -0 -r -n 1 -P "$(nproc)" clang-tidy-20 \
            --warnings-as-errors='*' \
            --extra-arg=-std=c++2c \
            -p backend/build
