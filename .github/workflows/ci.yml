name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LLVM_VERSION: 20

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-${LLVM_VERSION}
      - name: Check formatting
        run: |
          find src -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format-${LLVM_VERSION} --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (gcc 15, clang-tidy)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y g++-15 clang-tidy-${LLVM_VERSION} ninja-build bison flex

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure (also installs dependencies via vcpkg)
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' ! -name 'leiden_openmp.cpp' \
            | xargs -P"$(nproc)" -n1 clang-tidy-${LLVM_VERSION} -p build --quiet \
                --warnings-as-errors='*' --extra-arg=-Wno-unknown-warning-option

  build:
    name: build (gcc 15, docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
