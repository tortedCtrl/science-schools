services:
  postgres:
    image: postgres:16
    container_name: postgres-data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p \"$${POSTGRES_PORT}\" -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      ConnectionStrings__DefaultConnection: "host=postgres port=${POSTGRES_PORT} dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}"
      BACKEND_PORT: ${BACKEND_PORT}
      BACKEND_HOST: 0.0.0.0
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8080}"
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - backend
volumes:
  postgres-data:
networks:
  backend:
