services:
  postgres:
    image: postgres:16
    container_name: science-postgres-data

    environment:
      POSTGRES_USER: science_user
      POSTGRES_PASSWORD: science_password
      POSTGRES_DB: science_db
    ports:
      - "5432:5432"
    volumes:
      - science-postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  science-postgres-data: