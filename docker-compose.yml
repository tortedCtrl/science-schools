services:
  postgres:
    image: postgres:16
    container_name: science-postgres-data

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - science-postgres-data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
volumes:
  science-postgres-data: